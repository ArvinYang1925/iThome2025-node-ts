name: CI

# 觸發條件：當有程式碼推送到任何分支，或有 Pull Request 時
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # 代碼品質檢查工作
  code-quality:
    runs-on: ubuntu-latest

    steps:
      # 步驟 1: 檢出程式碼
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4

      # 步驟 2: 設置 Node.js 環境
      - name: 📦 設置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
          cache: "npm"

      # 步驟 3: 安裝依賴
      - name: 📚 安裝依賴套件
        run: npm ci

      # 步驟 4: 執行 Prettier 格式檢查
      - name: 🎨 檢查程式碼格式
        run: npm run format:check

      # 步驟 5: 執行 ESLint 檢查
      - name: 🔍 執行 ESLint 檢查
        run: npm run lint

      # 步驟 6: TypeScript 編譯檢查
      - name: 🔨 TypeScript 編譯檢查
        run: npx tsc --noEmit
